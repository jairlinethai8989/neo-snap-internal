<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แก้ไขภาพ • SnapCraft</title><link rel="stylesheet" href="app.css"></head>
<body class="editor-page">
  <header class="topbar">
    <a class="brand-link" href="#" id="homeLink"><img src="icons/icon.svg" alt=""><b>SnapCraft</b></a>
    <div class="file-info"><i></i><span><b>ภาพหน้าจอ</b><small id="imageInfo">กำลังเตรียมภาพ...</small></span></div>
    <div class="top-actions"><button class="icon-button" id="copyButton" title="คัดลอกภาพ"><i data-lucide="copy"></i></button><button class="save-button" id="downloadButton"><i data-lucide="download"></i>บันทึก PNG</button></div>
  </header>
  <main class="editor-workspace">
    <nav class="tool-row" aria-label="เครื่องมือ">
      <button class="tool active" data-tool="select" title="เลือกและย้ายวัตถุ"><i data-lucide="mouse-pointer-2"></i><span>เลือก</span></button>
      <button class="tool" data-tool="crop" title="ครอบตัดภาพ"><i data-lucide="crop"></i><span>ครอบตัด</span></button>
      <button class="tool" data-tool="pen" title="วาดเส้นอิสระ"><i data-lucide="pencil"></i><span>ปากกา</span></button>
      <button class="tool" data-tool="line" title="วาดเส้นตรง"><i data-lucide="slash"></i><span>เส้น</span></button>
      <button class="tool" data-tool="arrow" title="วาดลูกศร"><i data-lucide="arrow-up-right"></i><span>ลูกศร</span></button>
      <button class="tool" data-tool="box" title="วาดกรอบ"><i data-lucide="square"></i><span>กรอบ</span></button>
      <button class="tool" data-tool="block" title="วางบล็อกทึบ"><i data-lucide="square"></i><span>บล็อก</span></button>
      <button class="tool" data-tool="blur" title="เบลอข้อมูล"><i data-lucide="blend"></i><span>เบลอ</span></button>
      <button class="tool" data-tool="text" title="วางข้อความบนภาพ"><i data-lucide="type"></i><span>ข้อความ</span></button>
      <span class="tool-separator"></span>
      <button class="tool" id="deleteButton" title="ลบวัตถุ"><i data-lucide="trash-2"></i><span>ลบ</span></button>
      <button class="tool" id="undoButton" title="ย้อนกลับ"><i data-lucide="undo-2"></i><span>ย้อนกลับ</span></button>
      <button class="tool" id="redoButton" title="ทำซ้ำ"><i data-lucide="redo-2"></i><span>ทำซ้ำ</span></button>
      <button class="tool" id="clearButton" title="ล้างวัตถุทั้งหมด"><i data-lucide="eraser"></i><span>ล้าง</span></button>
    </nav>
    <section class="style-row">
      <label>สี <input id="colorInput" type="color" value="#ef3340"><output id="colorValue">#EF3340</output></label>
      <label>ขนาด <input id="sizeInput" type="range" min="2" max="32" value="6"><output id="sizeValue">6 px</output></label>
      <label>ความเบลอ <input id="blurInput" type="range" min="4" max="64" value="16"><output id="blurValue">16 px</output></label>
      <div class="swatches"><button style="--c:#ef3340" data-color="#ef3340" title="แดง"></button><button style="--c:#ffd25f" data-color="#ffd25f" title="เหลือง"></button><button style="--c:#72e7bd" data-color="#72e7bd" title="เขียว"></button><button style="--c:#3185f7" data-color="#3185f7" title="น้ำเงิน"></button><button style="--c:#17201d" data-color="#17201d" title="ดำ"></button></div>
      <div class="crop-actions" id="cropActions" hidden><button type="button" id="applyCrop" title="ใช้การครอบตัด"><i data-lucide="check"></i>ใช้</button><button type="button" id="cancelCrop" title="ยกเลิกการครอบตัด"><i data-lucide="x"></i>ยกเลิก</button></div>
    </section>
    <section class="canvas-stage" id="stage"><div class="loading" id="loading"><span></span><p>กำลังเตรียมภาพ...</p></div><canvas id="canvas"></canvas></section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="vendor/lucide.js"></script><script src="stitch.js"></script><script src="editor.js"></script>
</body></html>
